# Minimal SD card image for the Freescale iMX8 boards
#
# We mimic the .sdcard Freescale's image format:
# * the SD card must have 33 kB free space at the beginning,
# * U-Boot is integrated into imx8-boot-sd.bin and is dumped as is,
# * a FAT partition at offset 8MB is containing Image and DTB files
# * a single root filesystem partition is required (ext2, ext3 or ext4)
#

image boot.vfat {
  vfat {
    label = "boot"
    files = {
      "linux",
      "dtb",
      "rootfs"
    }
  }
  size = 256M
}

image sdcard.img {
  hdimage {
  }

  partition rk0-boot {
    in-partition-table = "no"
    image = "idblock.bin"
    offset = 32k
  }

  partition rk1-boot {
    in-partition-table = "no"
    image = "uboot.img"
    offset = 8M
  }
  #uboot environment offset. Must be equal with CONFIG_ENV_OFFSET paramter in uboot .config
  partition rk2-boot {
    in-partition-table = "no"
    image = "uboot_env_for_spinor.bin"
    offset = 7M
  }

   partition boot {
     partition-type = 0xC
     bootable = "true"
     image = "boot.vfat"
     offset = 16M
   }
}
