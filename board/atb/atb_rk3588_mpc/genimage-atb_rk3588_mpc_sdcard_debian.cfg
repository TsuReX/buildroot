image boot.vfat {
  vfat {
    label = "boot"
    files = {
      "uboot.env",
      "linux",
      "dtb",
      "rootfs"
    }
  }
  size = 256M
}

image sdcard.img {
  hdimage {
  }

  partition rk0-boot {
    in-partition-table = "no"
    image = "idblock.bin"
    offset = 32k
  }

  partition rk1-boot {
    in-partition-table = "no"
    image = "uboot.img"
    offset = 8M
  }

   partition boot {
     partition-type = 0xC
     bootable = "true"
     image = "boot.vfat"
     offset = 16M
   }

  partition rootfs {
    partition-type = 0x83
    image = "ext.rootfs.ext4"
  }
}
