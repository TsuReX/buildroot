image boot.vfat {
  vfat {
    label = "boot"
    files = {
      "linux",
      "dtb",
      "rootfs"
    }
  }
  size = 512M
}

image sdcard.img {

	partition idblock {
		in-partition-table = false
		image = "idblock.bin"
		offset = 32K
	}

	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1M
		gpt-no-backup = false
	}

	partition uboot {
		offset = 8M
		image = "uboot.img"
	}

	partition trust {
		offset = 12M
		image = "trust.img"
	}

	partition boot {
		partition-type-uuid = F
		offset = 20M
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type-uuid = L
		partition-uuid = 614e0000-0000-4b53-8000-1d28000054a9
		offset = 532M
		image = "rootfs.ext2"
	}
}
