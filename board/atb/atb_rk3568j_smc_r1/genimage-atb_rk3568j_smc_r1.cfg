
image recovery {
	vfat {
		label = "recovery"
		files = {
			"uboot.env",
			"linux",
			"dtb",
			"rootfs"
		}
	}
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1M
	}
	partition rk0-boot {
		in-partition-table = false
		image = "idblock.bin"
		offset = 32k
	}

	partition rk1-boot {
		in-partition-table = false
		image = "uboot.img"
		offset = 8M
	}

	partition boot {
		in-partition-table = true
		image = "recovery"
		offset = 16M
	}

	partition rootfs {
		in-partition-table = true
		image = "ext.rootfs.ext4"
	}
}
