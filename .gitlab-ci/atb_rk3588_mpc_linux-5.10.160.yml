atb_rk3588_mpc_linux-5.10.160:
  stage: build
  tags: [buildroot]
  image: ubuntu:22.04
  timeout: 24h
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt update
    - apt install -y make cmake git gcc g++ mtools genext2fs cpio rsync bc file
    - apt install -y python2 python3 unzip wget bzip2 curlftpfs dosfstools
  script:
    - mkdir -p dl
    - curlftpfs -o user="atbftp_user:32Vj_hy%c@gR" ftp.atb-e.ru:2121/ATB_FTP/buildroot/dl dl
    - make atb_rk3588_mpc_linux-5.10.160_defconfig
    - make
  artifacts:
    name: "atb_rk3588_mpc_linux-5.10.160"
    paths:
      - output/target
      - output/images/idblock.bin
      - output/images/uboot.img
      - output/images/Image
      - output/images/atb-rk3588-mpc.dtb
      - output/images/rootfs.cpio.gz
  rules:
 #   - if: ($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "prerelease" || $CI_COMMIT_REF_NAME == "develop")
      changes:
        - .gitlab-ci/atb_rk3588_mpc_linux-5.10.160.yml
        - configs/atb_rk3588_mpc_linux-5.10.160_defconfig
        - board/atb/atb_rk3588_mpc/linux-5.10.160/*
        - board/atb/atb_rk3588_mpc/uboot/*
        - board/atb/atb_rk3588_mpc/overlay/*
        - board/atb/common/rk3588-post-image.sh
