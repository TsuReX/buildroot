atb_rk3568j_smc_linux-5.10.110_uefi_build:
  stage: build
  tags: [buildroot]
  image: ubuntu:22.04
  timeout: 24h
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt update
    - apt install -y make cmake git gcc g++ mtools genext2fs cpio rsync bc file
    - apt install -y python2 python3 unzip wget bzip2 curlftpfs dosfstools
  script:
    - mkdir -p dl
    - curlftpfs -o user="atbftp_user:32Vj_hy%c@gR" ftp.atb-e.ru:2121/ATB_FTP/buildroot/dl dl
    - rm -rf output
    - make atb_rk3568j_smc_linux-5.10.110_uefi_defconfig
    - make
  cache:
    key: atb_rk3568j_smc_linux-5.10.110_uefi
    paths:
    - output
  rules:
    - if: $CI_PROJECT_NAME == "atb-buildroot-main"
      when: always
    - if: $CI_PROJECT_NAME != "atb-buildroot-main"
      when: manual

atb_rk3568j_smc_linux-5.10.110_uefi_artifact:
  stage: artifact
  tags: [buildroot]
  needs: ["atb_rk3568j_smc_linux-5.10.110_uefi_build"]
  script:
    - echo
  cache:
    key: atb_rk3568j_smc_linux-5.10.110_uefi
    paths:
    - output
  artifacts:
    name: "atb_rk3568j_smc_linux-5.10.110_uefi"
    paths:
      - output/target
      - output/images/idblock.bin
      - output/images/uefi.img
      - output/images/efi-part
      - output/images/Image
      - output/images/atb-rk3568j-smc.dtb
      - output/images/rootfs.cpio.gz
  when: manual
